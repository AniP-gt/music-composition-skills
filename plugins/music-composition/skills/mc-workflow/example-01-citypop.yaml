# ARR-SPEC の例 ① City Pop「終電」
# 良い例。セルフチェック 20 項目すべてに合格。AB 実験の B グループ用素材。
# この仕様では、セルフチェックの各項目に対応する判断を一つずつ明記している。どこまで具体的に書くかの目安にできる。

spec_version: "1.0"

meta:
  title: "終電"
  style_layer: "mc-style-citypop-rnb"
  key: "D major"
  mode: "ionian"
  meter: "4/4"
  tempo: 112
  target_duration: "4:04"        # 114 小節 × 4 拍 ÷ 112 BPM = 244 s
  deliverable: [full_mix, stems, midi, musicxml]

intent:
  one_thing: "一人で終電に乗って帰る途中、ふと駅に着いてほしくないと思う。"
  reference_pair:
    - track: "山下達郎 - Sparkle"
      borrow: "イントロでクリーンギターが 16 分音符を刻み続けるテクスチャーだけを取り入れる。曲調の明るさは持ち込まない"
    - track: "竹内まりや - Plastic Love"
      borrow: "サビのボーカルと伴奏の和声との距離感だけを取り入れる。ボーカルを前に出しすぎず、コード進行は引き継がない"
  listener_situation: "夜の通勤中にイヤホンで初めて聴く。注意の半分は窓の外に向いているので、耳に残るフレーズを 20 秒以内に一度聴かせる。"
  emotional_arc:
    - {section: I,  mood: "宙ぶらりんで、気持ちが定まらない",         value: 2}
    - {section: A1, mood: "日常を淡々と語る",     value: 3}
    - {section: B1, mood: "そわそわし始める",         value: 5}
    - {section: C1, mood: "気持ちのままに身を任せる",               value: 8}
    - {section: A2, mood: "日常に戻ろうとしても、もう戻れない", value: 4}
    - {section: B2, mood: "焦りが増す",               value: 6}
    - {section: C2, mood: "気持ちのままにすべてを委ねる",           value: 9}
    - {section: D,  mood: "ふっと何もなくなり、後悔がよぎる",   value: 3}   # ← ここが転機
    - {section: C3, mood: "もう後悔はない",           value: 10}
    - {section: O,  mood: "電車のドアが閉まる",           value: 4}

material:
  motif: "ヴァースの最初のフレーズに出る 4 音の下降モチーフ。2 音を順次進行で下ったあと、3 度跳躍する。長さは 2 拍で、第 2 拍の裏から入る"
  character: "力を抜いて、拍の後ろに乗る"
  stated_in: [A1]

form:
  - id: I
    name: "Intro"
    bars: 6                       # ★ 8 の倍数を外し、冒頭から非対称にする
    start_bar: 1
    harmony: "|IVmaj7 |III7 |VIm7 |%  |IVmaj7 |V |"
    harmony_letters: "|Gmaj7 |F#7 |Bm7 |%  |Gmaj7 |A |"
    melody_register: "中高"
    development: new
    energy: 2
    events: [ep_in, syn_lead_in]
    note: "8 小節のフレーズを 6 小節に詰める。第 5–6 小節はフレーズの後半を切った形で、ボーカルが早く入ったように聴こえる"

  - id: A1
    name: "Verse"
    bars: 16
    start_bar: 7
    harmony: "|Imaj7 |IIIm7 |IVmaj7 |V |VIm7 |IIIm7 |IVmaj7 |V |x2"
    harmony_letters: "|Dmaj7 |F#m7 |Gmaj7 |A |Bm7 |F#m7 |Gmaj7 |A |x2"
    melody_register: "中低"
    development: new
    energy: 3
    events: [drums_in, bass_in, gtr_in, vocal_in]
    note: "ボーカルはこのセクションを通して中低音域にとどめ、サビで 6 度上げられる余地を残す"

  - id: B1
    name: "Pre-Chorus"
    bars: 6                       # ★ 8 小節を外し、盛り上げるフレーズをあえて短くしてサビを前倒しする
    start_bar: 23
    harmony: "|IIm7 |IIIm7 |IVmaj7 |#IVm7b5 |V |%  |"
    harmony_letters: "|Em7 |F#m7 |Gmaj7 |G#m7b5 |A |%  |"
    melody_register: "中"
    development: sequence
    energy: 5
    events: [strings_teaser]
    note: "#IVm7♭5 は曲中で最初に出る調外のコード。サビの I に着いたときに「やっと着いた」と感じさせる"

  - id: C1
    name: "Chorus"
    bars: 16
    start_bar: 29
    harmony: "|IVmaj7 |V |IIIm7 |VIm7 |IVmaj7 |V |Imaj7 |%  |x2"
    harmony_letters: "|Gmaj7 |A |F#m7 |Bm7 |Gmaj7 |A |Dmaj7 |%  |x2"
    melody_register: "中高"
    development: new
    energy: 8
    events: [strings_in, syn_hook_returns]
    note: "王道の 4536 進行。出だしの一音でセクションの最高音に跳び込む"

  - id: A2
    name: "Verse"
    bars: 12                      # ★ A1 より 4 小節短くし、2 回目のヴァースに変化をつける
    start_bar: 45
    harmony: "|Imaj7 |IIIm7 |IVmaj7 |V |VIm7 |IIIm7 |IVmaj7 |V |IIm7 |IIIm7 |IVmaj7 |V |"
    harmony_letters: "|Dmaj7 |F#m7 |Gmaj7 |A |Bm7 |F#m7 |Gmaj7 |A |Em7 |F#m7 |Gmaj7 |A |"
    melody_register: "中低"
    development: vary
    energy: 4
    events: [gtr_out_half, strings_out]
    note: "A1 の繰り返し部分の前半をカットし、第 44 小節のフィルでつなぎ目を目立たなくする"

  - id: B2
    name: "Pre-Chorus"
    bars: 6
    start_bar: 57
    harmony: "|IIm7 |IIIm7 |IVmaj7 |#IVm7b5 |V |%  |"
    harmony_letters: "|Em7 |F#m7 |Gmaj7 |G#m7b5 |A |%  |"
    melody_register: "中高"
    development: repeat
    energy: 6
    events: [drums_build]
    note: "コード進行は B1 と共通。ボーカルを 1 オクターブ上げ、ドラムを 16 分音符の連打に切り替える"

  - id: C2
    name: "Chorus"
    bars: 16
    start_bar: 63
    harmony: "|IVmaj7 |V |IIIm7 |VIm7 |IVmaj7 |V |Imaj7 |%  |x2"
    harmony_letters: "|Gmaj7 |A |F#m7 |Bm7 |Gmaj7 |A |Dmaj7 |%  |x2"
    melody_register: "中高"
    development: repeat
    energy: 9
    events: [full_band, gtr_exit_after]
    note: "入る直前の半拍は全パートを止める（subtraction_events 参照）"

  - id: D
    name: "Bridge"
    bars: 10                      # ★ 8 小節を外す
    start_bar: 79
    harmony: "|bVImaj7 |bVII |IIIm7 |VI7 |bVImaj7 |bVII |Imaj7 |V/V |V |%  |"
    harmony_letters: "|Bbmaj7 |C |F#m7 |B7 |Bbmaj7 |C |Dmaj7 |E7 |A |%  |"
    melody_register: "低"
    development: fragment
    energy: 3                     # ★ エネルギー曲線が落ち込む箇所
    events: [drums_out, bass_out, sax_in]
    note: "★ 曲中で唯一、調から外れるセクション。♭VI/♭VII は同主短調からの借用で、VI7 と V/V はセカンダリー・ドミナント。ドラムとベースをすべて抜き、エレクトリックピアノ、ボーカル、サックスだけを残す"

  - id: C3
    name: "Chorus"
    bars: 18                      # ★ C1/C2 に対し、タグを 2 小節追加
    start_bar: 89
    harmony: "|IVmaj7 |V |IIIm7 |VIm7 |IVmaj7 |V |Imaj7 |%  |x2 |IVmaj7 |V |"
    harmony_letters: "|Gmaj7 |A |F#m7 |Bm7 |Gmaj7 |A |Dmaj7 |%  |x2 |Gmaj7 |A |"
    melody_register: "高"
    development: recap
    energy: 10
    events: [all_in, vocal_ad_lib]
    note: "末尾 2 小節のタグは解決させず、V にとどめたまま Outro に入る"

  - id: O
    name: "Outro"
    bars: 8
    start_bar: 107
    harmony: "|IVmaj7 |III7 |VIm7 |%  |IVmaj7 |III7 |VIm7 |%  |"
    harmony_letters: "|Gmaj7 |F#7 |Bm7 |%  |Gmaj7 |F#7 |Bm7 |%  |"
    melody_register: "中高"
    development: fragment
    energy: 4
    events: [vocal_out, sax_solo, fade_none]
    note: "Intro のコード進行に戻り、VIm で止める。出発時は D、戻った先は Bm で「駅には着かなかった」。フェードアウトせず、ばっさり切る"

arrangement:
  roster:
    - {id: drums_acoustic, midi: {program: 0, bank: 0, channel: 10}, instrument: "70 年代風に録ったアコースティックドラム＋gated snare", role: "律动",     band: "60 Hz–12 kHz", entry: A1, exit: end,  note: "D はセクションを通して鳴らさない"}
    - {id: bass_el,        midi: {program: 33, bank: 0, channel: 2}, instrument: "Precision Bass。指弾きで、音の伸びは短め",     role: "低频",     band: "40–250 Hz",    entry: A1, exit: end,  note: "拍より 12 ms 先行"}
    - {id: ep_rhodes,      midi: {program: 4, bank: 0, channel: 3}, instrument: "Rhodes Mk I ＋ 薄めの chorus",         role: "和声铺底", band: "200 Hz–2 kHz", entry: I,  exit: end,  note: "音域は C3–C4 に限定"}
    - {id: gtr_clean_16th, midi: {program: 27, bank: 0, channel: 4}, instrument: "Strat のシングルコイル。16 分音符のミュートストローク",  role: "织体",     band: "1–3 kHz",      entry: A1, exit: C2,   note: "★ D 以降はギターを入れず、サックスにスペースを譲る"}
    - {id: syn_lead_saw,   midi: {program: 81, bank: 0, channel: 5}, instrument: "Prophet 系のノコギリ波を単音で鳴らし、ゆっくりグライドさせる",       role: "记忆点",   band: "1.5–4 kHz",    entry: I,  exit: end,  note: "フックだけを弾く。伴奏の下支えには使わない"}
    - {id: strings_pad,    midi: {program: 48, bank: 0, channel: 6}, instrument: "ストリングス。高いポジションでロングトーンを弾く",               role: "色彩",     band: "400 Hz–6 kHz", entry: C1, exit: end,  note: "A2 で一度抜け、C2 で戻る"}
    - {id: sax_tenor,      midi: {program: 66, bank: 0, channel: 7}, instrument: "テナーサックス",                     role: "旋律",     band: "250 Hz–4 kHz", entry: D,  exit: O,    note: "★ 曲の後半で初めて入り、Outro では主役になる"}
    - {id: vocal_lead,     midi: {program: 53, bank: 0, channel: 1}, instrument: "女性ボーカル。息を多めに混ぜ、前に出しすぎない",           role: "旋律",     band: "200 Hz–8 kHz", entry: A1, exit: C3,   note: "★ Outro はボーカルなし"}

  depth_map: {vocal_lead: 前景, syn_lead_saw: 前景, sax_tenor: 前景, gtr_clean_16th: 中景, drums_acoustic: 中景, bass_el: 背景, ep_rhodes: 背景, strings_pad: 背景}
  bass_kick_relation: {mode: 交织式, detail: "A/B ではベースをキックとずらして掛け合いにする。C ではキックと重ねて厚みを出す。D にはドラムを入れない"}

  spectrum_budget:
    - {band: "40–120 Hz",   owner: bass_el,        competitors: [drums_acoustic], resolution: "Kick をトリガーに Bass をサイドチェインでダッキング。リリースは 30 ms で、Kick が鳴るタイミングで Bass を 3 dB 下げる"}
    - {band: "200–500 Hz",  owner: ep_rhodes,      competitors: [strings_pad, vocal_lead], resolution: "错开音区：音域をずらす。ep は C3–C4 に絞り、strings は C4 以上だけに書く"}
    - {band: "1–3 kHz",     owner: gtr_clean_16th, competitors: [syn_lead_saw],   resolution: "交替出现：交互に鳴らす。gtr は A/B のみ、syn_lead は I/C/O のフレーズ末尾の隙間のみ"}
    - {band: "6–12 kHz",    owner: drums_acoustic, competitors: [strings_pad],    resolution: "strings は 8 kHz で高域をロールオフし、空気感は hihat に任せる"}

  energy_curve: {I: 2, A1: 3, B1: 5, C1: 8, A2: 4, B2: 6, C2: 9, D: 3, C3: 10, O: 4}

  subtraction_events:
    - {at: {section: C2, bar_offset: -1, beat: 4.5}, what: "入る直前の半拍は、ドラムも含めて全パートを止める", why: "2 回目のサビは、音量を上げる代わりに直前の無音で 1 回目より強く印象づける"}
    - {at: {section: D}, what: "セクション全体でドラムとベースを抜き、エレクトリックピアノ、ボーカル、サックスだけを残す", why: "C3 を成立させるには、その前に曲全体のエネルギーが最も低くなる箇所が必要"}
    - {at: {section: A2}, what: "ストリングスとギターの半数を抜く", why: "2 回目のヴァースは 1 回目より音数を減らし、隙間を広く取る"}

  hooks:
    vocal_hook:
      where: "C1 第 1–2 小節"
      shape: "前置きなしに最初の音節でセクションの最高音を歌い、続いて 5→3 と下行する"
    arrangement_hook:
      what: "syn_lead_saw の 3 音の上行リフ D–E–F#。最後の音を 1 拍半伸ばしてから、短3度下へゆっくりグライドする"
      first_at: I
      recurs_at: [C1, C2, C3, O]

  groove:
    feel: "straight16"
    push_pull:
      - {part: bass_el,        offset_ms: -12, note: "ベースだけが拍を先取りし、曲に前へ進む感覚を出す"}
      - {part: gtr_clean_16th, offset_ms: 8,   note: "ストロークをわずかに遅らせ、ベースとのタイミングの差で幅が広がったように聴かせる"}
      - {part: drums_acoustic, offset_ms: 0,   note: "ドラムはグリッドにそろえ、タイミングの基準にする"}
    fill_policy:
      bars: [22, 28, 44, 62, 78, 88, 106]
      rationale: "原則としてセクションが切り替わる前の 1 小節だけに入れる。セクションの途中に置く唯一のフィルは第 44 小節で、A2 が A1 より 4 小節短くなるつなぎ目を目立たなくする。フィルの間隔はあえて不均等にする。"

vocal:
  persona: "20 代の女性ボーカル。主に中低音域を使い、サビで中高音域まで上げる。息を多めに混ぜて前に出しすぎず、80 年代の東京の city pop らしい都会的な質感を出す"
  delivery: "息を多めに混ぜ、声量を抑える。独り言のように、発音を作り込みすぎず力を抜いて歌う"
  dynamics_by_section: {I: 0, A1: 3, B1: 5, C1: 7, A2: 4, B2: 6, C2: 8, D: 2, C3: 9, O: 0}
  phrasing:
    - {line: "C1 の最初のフレーズ", timing: "40ms 前に出す", why: "サビは最初の音節が最高音なので、拍より早く入って前置きのない歌い出しにする"}
    - {line: "A2 の各フレーズの末尾", timing: "80ms 後ろにずらす", why: "2 回目のヴァースは 1 回目より気だるく歌う。音数はそのままに、タイミングを後ろへずらす"}
    - {line: "D の最後の 2 フレーズ", timing: "自由", why: "ドラムとベースを抜いてあるので、ボーカルはグリッドから離れて歌う"}
  breath_points:
    - {section: C1, line: 1, after_syllable: 8, note: "第 2 小節のあとで息を継ぎ、ブレス音は残す"}
    - {section: D, line: 4, after_syllable: 0, note: "D の最後の 2 小節は歌わない（余白の箇所。self_audit 参照）"}
  ad_libs:
    - {at: {section: C2}, what: "フレーズ末尾で、ごく小さな声で音を滑らせて上げる。この 1 回のみ"}
    - {at: {section: C3, bar_offset: 12}, what: "第 13–16 小節のタグにアドリブを重ね、主旋律とタイミングをずらす"}
  chorus_variation: "C1 は素直に歌う。C2 は語尾の音を半拍伸ばす。C3 は第 3 フレーズを 1 オクターブ下げ、第 4 フレーズで元の音域に戻す"
  stacking: "C1 はハモリなし。C2 は 3 度のハモリを 1 声加える。C3 は「駅に着いてほしくない」のフレーズにだけ、3 度と 6 度のハモリを 2 声重ねる"
  register_arc: "A は中低音域 → C は中高音域 → D で低音域に戻る → C3 で曲中の最高音に達する"

mix_intent:
  ducking_map:
    - {section: C1, who_yields: strings_pad, band: "1–3 kHz",    to: vocal_lead}
    - {section: C2, who_yields: strings_pad, band: "1–3 kHz",    to: vocal_lead}
    - {section: A1, who_yields: ep_rhodes,   band: "200–500 Hz", to: vocal_lead}
    - {section: A2, who_yields: ep_rhodes,   band: "200–500 Hz", to: vocal_lead}
    - {section: O,  who_yields: ep_rhodes,   band: "250 Hz–4 kHz", to: sax_tenor}
  dynamics:
    target_DR_dB: 10
    notes:
      - "D の短時間ラウドネスは C2 より必ず 6 dB 低くする。曲中でこれほど大きな落差をつけるのはここだけ"
      - "C3 のラウドネスは C2 より 1.5 dB 高いだけに抑え、編成と 18 小節の長さでインパクトを強める"
  width_map: {I: medium, A1: narrow, B1: medium, C1: wide, A2: narrow, B2: medium, C2: wide, D: narrow, C3: wide, O: medium}
  loudness_target: "-10 LUFS integrated"

render:
  suno:
    style_prompt: "1980s Japanese city pop, 112 BPM, D major, Rhodes electric piano, 16th-note muted clean guitar, electric bass playing ahead of the beat, gated reverb snare, analog saw synth lead riff, tenor saxophone solo in the bridge and outro, female vocal with breathy tone mixed back, warm tape saturation"
    # section_tags は form[].name から生成するため、手入力は不要
    exclude: ["EDM drop", "trap hi-hats", "modern sidechain pumping", "orchestral epic", "fade out ending"]
    knobs: {model: "v4.5+", weirdness: "35%", style_influence: "65%"}
  yue:
    genre_tags: "city pop, japanese, female vocal, rhodes electric piano, clean guitar, tenor saxophone, analog synth lead, 112 bpm, D major, nostalgic, night drive"
    structure: ["intro", "verse", "pre-chorus", "chorus", "verse", "pre-chorus", "chorus", "bridge", "chorus", "outro"]
    ref_audio: null
    abc: null   # mc-symbolic-score でコンパイルする。処理全体が通るまでは空欄
  midi:
    instrument_map:
      drums_acoustic: {name: "Standard Kit", program: 0, bank: 0, channel: 10}
      bass_el: {name: "Electric Bass (finger)", program: 33, bank: 0, channel: 2}
      ep_rhodes: {name: "Electric Piano 1", program: 4, bank: 0, channel: 3}
      gtr_clean_16th: {name: "Electric Guitar (clean)", program: 27, bank: 0, channel: 4}
      syn_lead_saw: {name: "Lead 2 (sawtooth)", program: 81, bank: 0, channel: 5}
      strings_pad: {name: "String Ensemble 1", program: 48, bank: 0, channel: 6}
      sax_tenor: {name: "Tenor Sax", program: 66, bank: 0, channel: 7}
      vocal_lead: {name: "Voice Oohs（Suno/YuE で生成。基準となる MIDI では仮音源として使う）", program: 53, bank: 0, channel: 1}

checks:
  self_audit:
    - "[x] one_thing を声に出すと、「駅に着いてほしくない」という一つの気持ちを表す一文になっている"
    - "[x] リファレンス 2 曲から取り入れる要素が異なる。一方はテクスチャー、もう一方はボーカルの距離感"
    - "[x] arrangement_hook は譜面なしで口ずさめる 3 音の上行フレーズ"
    - "[x] melody_register に対比がある。A は中低音域、C は中高音域、D は低音域、C3 は高音域"
    - "[x] D の最後の 2 小節はボーカルが止まり、サックスだけになる。「後悔がよぎる瞬間」を言葉にせず、余白を作る"
  exemptions: []

# メッセージチャンネル（schema §5.3）。ミックス担当に送るメッセージの記入例
messages:
  - from: music
    to: sound
    about: ["mix_intent.dynamics", "arrangement.subtraction_events"]
    says: "D を C2 より 6 dB 下げるところが、曲中で唯一の大きな落差です。C2 の直前に全パートを半拍止めるのも意図したものです。-10 LUFS を目標に調整する際は、バスコンプでこの落差や無音が埋まらないよう、両方とも残してください。残すのが難しければ一言返信をください。このパッケージ側で C3 の編成を変えて補います"
    status: open

# 生成バックエンドの機能一覧（スキルとは別に管理するデータ）
#
# 新しいモデルを追加するには、ここにブロックを一つ追加する。**スキルの変更は不要**。
# `mc-render-compile` はこのファイルを参照して ARR-SPEC のコンパイル方法を決める。
# 仕様への準拠率を算出する際は、honors を参照して採点対象を決める。
#
# ★ honors の3つの値によって準拠率の算出方法が決まる。
#     exact —— フィールドの指定を正確に実行できる。採点対象とし、指定を満たさなければ未達とする。
#     hint  —— ヒントとして生成に影響を与えられる。採点対象とするが、重みは下げる。
#     none  —— バックエンドがフィールドを受け付けない。**採点対象から外し**、「このバックエンドでは未対応」と記す。
#   none の項目を0点にしてはいけない。たとえば Suno には正確なコード進行を渡していないため、
#   「指定どおりのコード進行になっていない」と減点すると、実行できない項目まで評価することになる。
#
# ★ transport は、バックエンドが通常どこで動くかを記録する参考情報。実行の前提条件にはしない。
#   このライブラリを参照するのはエージェント。mc-render-compile は各バックエンドに渡す入力値（prompt / ABC / パラメーター）を生成する。
#   コマンドライン、Python API、ComfyUI のようなノードベースの実行環境のどれを使うかは、ユーザーの環境による。
#   値は hosted（ホスティング型サービス）または local（ローカルのモデル重み）。known_carriers には動作が知られている実行環境を参考として記載する。
#
# 調査日 2026-09-15

version: 2

backends:

  # ═══════════════════════════════════════════════════════════
  - id: yue2
    name: "YuE2 (3B)"
    transport: local
    known_carriers:
      comfyui: [audio_yue2_text2music, audio_yue2_music_cover]   # 参考として、この実行環境でのテンプレート名を記載
    note: >
      ★ ARR-SPEC の指定をヒントにとどめず、そのとおりに実行できる唯一のバックエンド。
      まずモデル自身が ABC 楽譜を書き（記号表現による作曲プランの作成）、次に ABC から音声を合成する。
      **最初の工程を迂回し**、ARR-SPEC からコンパイルした ABC を音声合成の工程に直接渡す。
      YuE2 対応の実行環境ならこの方法を使える（公式スクリプトのほか、ComfyUI にはネイティブノードがある）。
      mc-symbolic-score の最初の出力先となる。
      ★ 実測（2026-09-17）。外部から渡す ABC では L:1/32 を使い、ボーカルの旋律は小文字の音名の音域に置き、w: 行を付ける。L:1/16 では曲の半ばで止まり、大文字の音名の音域では歌詞の母音が曖昧になる。whisper の認識率は直接生成で76%、コンパイルした楽譜で56%。差は旋律の密度による。詳細は mc-symbolic-score §6b を参照。
    license:
      code: Apache-2.0
      weights: CC-BY-NC-4.0
      commercial_ok: false        # ★ モデル重みは非商用。公開前に必ず確認する
    model_file: yue2_3b_int8_convrot.safetensors
    accepts:
      style_prompt: prose
      lyrics: text
      symbolic_score: abc               # ★ 他の生成モデルにはない機能
      reference_audio: "cover テンプレートが対応（元のメロディーを保ってスタイルを変更）"
      seed: true
    honors:
      meta.key: exact
      meta.tempo: exact
      meta.meter: exact
      form.bars: exact
      form.harmony: exact
      form.name: exact
      arrangement.roster: hint
      arrangement.energy_curve: hint
      vocal: hint
      mix_intent: none
    upstream_skill: >
      公式リポジトリに skills/yue2-music/ が付属する（SKILL.md 形式で「音楽上の不変条件のチェック」を含む）。
      ★ 公式スキルを書き直さず、ここでは ARR-SPEC→ABC のアダプターを実装する。モデルの操作方法は公式スキルを参照する。

  # ═══════════════════════════════════════════════════════════
  - id: minimax-music-3
    name: "MiniMax Music 3"
    transport: local
    known_carriers:
      comfyui: [audio_minimax_music_3]   # 参考として、この実行環境でのテンプレート名を記載
    note: >
      ホスティング型 API は新規ユーザーの受け付けを終了している。ローカルで使えるモデル重みは提供されており、
      ComfyUI などがネイティブ対応している。API の利用制限はローカル版には適用されない。
      公式の説明では、テキストプロンプトから構成の安定した5分間の楽曲を丸ごと生成できる。
    license:
      commercial_ok: "モデル重みのライセンスは要確認"
    accepts:
      style_prompt: prose
      lyrics: text
      symbolic_score: false
      reference_audio: "ホスティング版は cover に対応。ローカル版は要確認"
    honors:
      meta.tempo: hint
      meta.key: hint
      form.bars: none
      form.harmony: none
      form.name: hint
      arrangement: hint
      vocal: hint
      mix_intent: none

  # ═══════════════════════════════════════════════════════════
  - id: ace-step-1.5
    name: "ACE-Step 1.5 XL（Base / Turbo / SFT / 4B-LLM / AIO）"
    transport: local
    templates:
      - audio_ace_step1_5_xl_base
      - audio_ace_step1_5_xl_turbo      # 蒸留版。生成が速い
      - audio_ace_step1_5_xl_sft        # CFG を調整でき、プロンプトへの準拠度を最も細かく制御できる
      - audio_ace_step_1_5_split_4b     # 4B LLM 版。音楽の理解力が高い
      - audio_ace_step_1_5_checkpoint   # AIO
    note: >
      ★ 見落としやすいモデル群。1つのモデルに5つのバリエーションがあり、**どの版を選ぶか自体が調整手段になる**。
      Turbo は仕様を手早く試すのに使い、SFT では CFG でプロンプトへの準拠度を調整する。4B-LLM 版は理解力が最も高い。
      同じモデル群の中では変動要因が少ないため、AB 比較ではモデルそのものを替える場合より条件をそろえやすい。
    accepts:
      style_prompt: "スタイルタグ ＋ 自然文"
      lyrics: text
      symbolic_score: false
      cfg: true                         # ★ SFT 版で調整できる。指示への準拠度に直接影響する
      seed: true
    honors:
      meta.tempo: hint
      meta.key: hint
      form.bars: none
      form.harmony: none
      form.name: hint
      arrangement: hint
      vocal: hint
      mix_intent: none

  # ═══════════════════════════════════════════════════════════
  - id: stable-audio-3
    name: "Stable Audio 3.0 Medium"
    transport: local
    known_carriers:
      comfyui: [audio_stable_audio_3_medium, audio_stable_audio_3_medium_base]   # 参考として、この実行環境でのテンプレート名を記載
    note: >
      効果音と器楽向けで、楽曲全体の生成には向かない。arrangement_hook を担う特徴的な音色や、
      riser／impact などの効果音を単独で生成し、別のバックエンドで作る編曲に組み込む。
      実行環境によっては、テンプレートが生成前に LLM でプロンプトを詳しく書き足す。
    accepts:
      style_prompt: prose
      lyrics: false                     # ★ ボーカルなし
      duration: true
      seed: true
      category: true
    honors:
      meta.tempo: hint
      form: none
      arrangement.hooks: hint           # 単発の音響イベントに限って有効
      vocal: none
      mix_intent: none

  # ═══════════════════════════════════════════════════════════
  - id: suno
    name: "Suno"
    transport: hosted                   # ホスティング型サービス。ローカルのモデル重みなし
    note: >
      細かい制御は最も難しいが、生成結果の仕上がりは最もよい。指定できるのは自然文によるスタイルの説明とセクションタグ。
      調性、ハーモニー、小節数はヒントとして示せるだけで、モデルが従うとは限らない。
    license:
      commercial_ok: "契約プランによる。公開前に各自で確認する"
    accepts:
      style_prompt: prose
      lyrics: text
      section_tags: true
      exclude_tags: true
      symbolic_score: false
    honors:
      meta.tempo: hint
      meta.key: hint
      meta.meter: none
      form.bars: none                   # ★ 制御できないため採点対象から外す
      form.harmony: none                # ★ 同上
      form.name: hint
      arrangement.roster: hint
      arrangement.energy_curve: hint
      vocal: hint
      mix_intent: none
    strategy: >
      細かく制御できない項目に手間をかけず、スタイルの説明に具体的な情報を盛り込み、セクションタグの並びを詰める。
      一度の生成で指定を満たすことを期待せず、best-of-N で候補を出し、準拠率順に並べて選ぶ。

  # ═══════════════════════════════════════════════════════════
  - id: symbolic
    name: "記号楽譜による生成：ABC / MIDI / MusicXML → 音源レンダリング"
    transport: local
    note: >
      LLM が記号楽譜を直接生成し、音源でレンダリングする。**出力は完全に決定的で、細部まで制御できる**。
      ボーカルは入らず、音色は使用する音源で決まる。用途は2つある。
      ①日本式の MIDI 打ち込みはもともとこの手順で行う。
      ②AB 比較で**変数を固定するための基準**にする。同じ仕様からは常に同じ結果が得られる。
      ABC ↔ MusicXML ↔ MIDI は相互変換できるため、mc-symbolic-score の同じ書き出し処理で
      YuE2 への ABC 入力と、この音源レンダリングの両方に対応できる。
    license: {commercial_ok: true}
    accepts:
      symbolic_score: [abc, midi, musicxml]
    honors:
      meta.key: exact
      meta.tempo: exact
      meta.meter: exact
      form.bars: exact
      form.harmony: exact
      arrangement.roster: exact
      arrangement.energy_curve: exact   # velocity / CC で正確に指定できる
      vocal: none
      mix_intent: none

# ═══════════════════════════════════════════════════════════
# 補助ツール（同じ制作工程で使うツール。生成バックエンドには含めない）
tools:
  - id: audio-separation
    transport: any
    known_carriers: {demucs: cli, comfyui: utility-audioseparation}
    note: >
      ★ ステム分離。ボーカル／ベース／ドラム／その他。
      ボーカルの AI らしさを判定する4項目（曲全体の強弱が一定か、3回のサビが似通っているか、ブレス、ad-lib）を確認するには、
      まずボーカルトラックを分離する。どの分離ツールを使うかはユーザーの環境による。

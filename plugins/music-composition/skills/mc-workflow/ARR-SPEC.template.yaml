# ARR-SPEC 記入用テンプレート（v1.0）
# 仕様は ARR-SPEC.schema.md を参照。記入後は mc-workflow §3.0 の20項目を一つずつ確認する。
# ★ 印は自己チェック項目。条件を満たさない項目は修正するか、理由を明記する。
# ★ 実行に使うフィールドは ASCII のみ。コード表記には △ ø ° ♭ ♯ を使わず、maj7 / m7b5 / dim / b / # を使う。繰り返しは x2 と書く。

# ★★ YAML の厳守事項（エージェントが特に間違えやすい箇所）
#   リスト型フィールド（roster / sound_stage / push_pull / subtraction_events / emotional_arc …）
#   の `- {…}` 項目の直下に `note:` キーを追加してはいけない。リストにマッピングが混在し、ファイル全体の解析に失敗する。
#   リストに注記するには、リストと同じ階層に `xxx_note:`（例 `sound_stage_note:`）を置くか、`#` で行コメントを書く。
#   記入後にインデントを見直す。

spec_version: "1.0"

meta:
  title: ""
  style_layer: "none"          # ベースとなるスタイルの L3 スキル ID。未作成なら none
  style_layers: []             # ✦ スタイルを組み合わせる場合は [{skill, role: base|overlay, owns: [担当する要素…]}]。単一スタイルなら空欄。schema §1.1.1 を参照
  fusion_note: ""              # ✦ スタイルを組み合わせる場合は、なぜその組み合わせが成立するかを一文で書く
  key: ""                      # ★ lint#20 書式は "<主音> <major|minor>"。例 "F# minor" "Bb major"
  mode: ""                     # 空欄可。長調・自然短調以外の場合は dorian/mixolydian… を指定（MusicXML の9種類）
  meter: "4/4"
  # meter_map: [{bar: 1, meter: "4/4"}, {bar: 33, meter: "3/4"}]   # 拍子の変更はここに書く。note には書かない
  tempo: 0
  # tempo_map: [{bar: 1, bpm: 96}]
  target_duration: "0:00"      # ★ lint#14 Σbars×拍の長さ と一致させる（±10%）
  deliverable: [full_mix]      # full_mix / stems / midi / musicxml / chordpro / abc
  upstream:                    # 上流の情報があれば出所を問わず参照し、なければこのパッケージで分析する（schema §5.2）
    brief: ""                  # 要望の出所と原文。なければ none
    lyrics: {}                 # 同じ曲の歌詞 {source, flow: 先曲后词|先词后曲, shared, sections: [{id, lines: []}]}。詞先（先词后曲）の場合は shared の6項目を固定する（schema §5.4）
    picture: {}                # 曲を合わせる映像 {source, sec, hits: [{at_sec, what}], note}

# ─────────────────────────────────────────────────────────
# 制作前の必須項目。4項目すべてを埋めてから form に進む
# ─────────────────────────────────────────────────────────
intent:
  one_thing: ""                # ★ やることを一つに絞って一文で書く。「〜も〜も」と並べない
  reference_pair:              # ★ ちょうど2件。borrow には各曲のどの要素を取り入れるかを明記する
    - {track: "", borrow: ""}
    - {track: "", borrow: ""}
  listener_situation: ""       # ★ どこで聴くか、何回目か、どの程度集中して聴くか
  emotional_arc:               # ★ 感情の流れに転換を入れる。上がり続けるだけでは未記入扱い
    - {section: "", mood: "", value: 0}

# ───────────────────────────────────────
# 主題素材（★ mc-development が担当。lint#18）。★ フィールドの説明だけでは足りないため、記入前に mc-development を読む
# ───────────────────────────────────────
material:
  motif: ""                    # ★ 音程の輪郭、リズム型、長さを、モチーフがわかるように言葉で書く
  motif_abc: ""                # 任意。同じモチーフを1〜2小節の ABC で書く（L: と音符のみ）。記入すれば楽譜に書き出せる
  character: ""                # モチーフの性格を一文で書く
  stated_in: []                # モチーフを原形で提示するセクションの ID。1件以上
  development_mode: ""         # 加工处理（加工）/展衍（展開）/对比（対比）から主となる手法を一つ選ぶ（mc-development §5.1）

# ─────────────────────────────────────────────────────────
# 曲の構成表
# ─────────────────────────────────────────────────────────
form:
  - id: ""                     # ファイル全体で一意
    name: ""                   # ★ lint#20 Intro/Verse/Pre-Chorus/Chorus/Post-Chorus/Bridge/Instrumental/Solo/Breakdown/Drop/Outro
    bars: 0                    # ★ lint#3 全セクションの小節数が8の倍数になる構成は不可
    start_bar: 0               # ★ lint#2 各セクションを隙間なくつなぐ
    harmony: ""                # "|VIm7 |IVmaj7 |I |V |"   ASCII 表記の例は bVI、#IVm7b5、V/V
    harmony_letters: ""        # ★ lint#19 "|F#m7 |Dmaj7 |A |E |"   両方の表記が必須。1小節にコードが2つある場合は空白で区切り、拍数が異なる場合は Em7(3) A(1) のように書く
    melody_register: ""        # 低/中低/中/中高/高
    # melody_range: "A3-E5"    # 任意。実際の音域を指定すると書き出せる
    development: ""            # ★ lint#18 repeat/sequence/extend/contract/fragment/vary/augment/counterpoint/new/recap。主となる手法と副次的な手法は "+" でつなぐ
    energy: 0                  # 0–10
    events: []                 # [drums_in, bass_in, gtr_out]。<roster_id>_in / _out のみ有効
    note: ""                   # 非対称な構成はここに書く。拍子の変更は meter_map に書く

# ─────────────────────────────────────────────────────────
# 編曲
# ─────────────────────────────────────────────────────────
arrangement:
  roster:
    - id: ""
      instrument: ""           # 具体的な音色を指定する。「シンセサイザー」のような分類名だけでは不可
      midi: {program: 0, bank: 0, channel: 1}   # GM 音色番号。ドラムキットは channel 10。deliverable に midi/musicxml が含まれる場合は必須
      role: ""                 # 律动（グルーヴ）/低频（低域）/和声铺底（ハーモニーの土台）/织体（テクスチャー）/旋律/色彩/记忆点（フック）
      band: ""                 # "1-3 kHz" または 低频（低域）/中低/中高/高
      entry: ""                # ★ セクション ID
      exit: ""                 # ★ lint#7 少なくとも1パートは end 以外を指定する
      note: ""

  depth_map:          # ✦ {roster_id: 前景|中景|背景}。聴き手は音の高さ・大きさ・速さ・変化の速さでどのパートが前景にあるかを判断する。このうちミックスで調整できるのは音量だけ
  bass_kick_relation: # ✦ {mode: 结合式|互答式|交织式, detail}。3種類（同じリズムで重ねる・掛け合う・重なりとずれを織り交ぜる）から一つ選んで明記する
  spectrum_budget:
    - {band: "", owner: "", competitors: [], resolution: ""}   # 帯域を譲る、音域をずらす、交互に鳴らす

  energy_curve: {}             # ★ lint#4 キーの集合は form の ID の集合と一致させる。lint#5 少なくとも1回は下げる

  subtraction_events:          # ★ lint#6 1件以上。at には構造化した位置を指定する（schema §1.9）。文章は不可
    - {at: {section: "", bar_offset: 0}, what: "", why: ""}

  hooks:
    vocal_hook: {where: "", shape: ""}
    arrangement_hook:          # ★ lint#8 ボーカル以外のフック。必須
      what: ""
      first_at: ""
      recurs_at: []
      abc: ""                  # 任意。1〜2小節の ABC

  groove:
    feel: ""                   # straight/swing16/shuffle/halftime/2:1/3:1
    push_pull:                 # ★ lint#11 少なくとも1項目は offset_ms != 0
      - {part: "", offset_ms: 0, note: ""}
    fill_policy:               # ★ lint#10 bars を公差4の等差数列にしてはいけない
      bars: []
      rationale: ""

# ─────────────────────────────────────────────────────────
# 歌唱設計（mc-vocal-direction）。生成モデルの歌い方を指定する。実際の歌い手への録音指示には使わない
# 聴き手は特にボーカルに注意を向ける。歌唱は、歌詞に次いで AI らしさが出やすい
# ─────────────────────────────────────────────────────────
vocal:
  persona: ""                  # ★ 歌い手の性別、音域、声質、時代感を指定する。「女性ボーカル」だけでは未記入扱い
  delivery: ""                 # 息を多く含む声／芯のある声／その中間。発音をどの程度はっきりさせるかも指定する
  dynamics_by_section: {}      # ★ lint#15 異なる値を2つ以上使い、全編を同じ強さにしない。0–10。書き出し時は schema §1.5 に従って ppp–fff に変換する
  phrasing: []                 # [{line: "", timing: "60ms 後ろにずらす"/"30ms 前に出す", why: ""}]
  breath_points: []            # [{section: "", line: 1, after_syllable: 4, note: ""}]。breath-mark として書き出す
  ad_libs: []                  # [{at: {section: ""}, what: ""}]。★ 均等に配置してはいけない
  chorus_variation: ""         # ★ lint#16 サビの3回の歌い方をそれぞれどう変えるか
  stacking: ""                 # ハモリやダブリングを何層重ね、歌詞のどの行で入れるか
  register_arc: ""             # form[].melody_register と一致させる

# ─────────────────────────────────────────────────────────
# ミックスの意図。ここでは意図だけを書き、EQ・コンプレッション・マスタリングはミックス工程で扱う
# ─────────────────────────────────────────────────────────
mix_intent:
  mood: ""                     # ★ 一文で書く。他の判断と矛盾する場合はこの方針を優先する
  sound_stage: []              # [{id: "", pan: 0, depth: 前景|中景|背景}]。pan は -100..100。負は左、正は右
  ducking_map:
    - {section: "", who_yields: "", band: "", to: ""}
  dynamics:
    target_DR_dB: 0
    notes: []                  # "どのセクションをサビより x dB 小さくする必要があるか"
  width_map: {}                # ★ lint#12 異なる値を2つ以上使う
  loudness_target: ""          # "-9 LUFS integrated"

# ─────────────────────────────────────────────────────────
# コンパイル先
# ─────────────────────────────────────────────────────────
render:
  suno:
    style_prompt: ""           # ★ lint#13 空欄不可。epic/emotional/beautiful のように具体性のない語は避ける
    # section_tags: []         # form[].name から生成するため手入力は不要。手入力する場合は form と一致させる
    exclude: []
    knobs: {model: "", weirdness: "", style_influence: ""}
  yue:
    abc: ""           # ✦ YuE2GenerateMusic に直接渡せる ABC 楽譜（mc-symbolic-score が生成）
    genre_tags: ""
    structure: []
    ref_audio: null
  midi:
    instrument_map: {}         # {roster_id: {name: "VST またはサンプルライブラリ名", program: 0, bank: 0, channel: 1}}。GM 番号は roster[].midi に従う
  musicxml:
    lead_sheet: true           # 歌唱用リードシート。メロディー、コード、歌詞、セクション、強弱、ブレスを記載する
    parts: []                  # 追加でパート譜を出す roster ID
  chordpro:
    transpose: 0

# ─────────────────────────────────────────────────────────
# 手動の自己チェック（自動チェック項目は lint で確認）
# ─────────────────────────────────────────────────────────
checks:
  self_audit:
    - "[ ] one_thing を声に出して読むと、一文で一つのことを述べている"
    - "[ ] 2曲のリファレンスから取り入れる要素が重複していない"
    - "[ ] 楽譜を見ずに arrangement_hook を口ずさめる"
    - "[ ] 少なくとも1つのセクションで、melody_register が隣接するセクションと明確に異なる"
    - "[ ] 曲中に、音や言葉が入りそうなところであえて間を取る箇所がある。その位置を明記する"
  exemptions: []               # lint の項目を適用除外にする場合は、項目番号と理由をここに書く

# ─────────────────────────────────────────────────────────
# メッセージ欄（schema §5.3）。誰でも書き込める共有欄。返信が見当たらなければ、このパッケージでは待たずに進める
# ─────────────────────────────────────────────────────────
messages: []
# 1件の例 {from: music, to: sound, about: "mix_intent.dynamics", says: "相手に何をしてほしいか、その理由は何か", status: open}
# from / to は music（このパッケージ）lyrics sound editing shot-design writing production のいずれかとし、それぞれ異なる値にする
# status は open（送信済み・返信待ち）/ answered（返信済み・フィールド未変更）/ accepted（依頼に従ってフィールドを変更済み）/ rejected（reply に理由を記入）

# example-02 —— ★ スタイルを掛け合わせた例：ラップ＋中国風（《桃花扇》のスタイル）
#
# meta.style_layers の役割分担表と lint #17 の例。form/arrangement などの項目は簡略化している。
# ここでは #17 だけを確認する。仕様は未完成なので、ほかのセルフチェック項目は不合格になる。
#
# スタイルを組み合わせる仕組みは、個々のスタイル用スキルの有無に左右されない。

spec_version: "1.0"
meta:
  title: "扇の面（サンプル）"
  style_layer: mc-style-chinese-pop
  style_layers:
    - {skill: mc-style-chinese-pop, role: base,    owns: [harmony, melody, color_instruments, vocal_delivery_chorus, form]}
    - {skill: mc-style-hiphop,      role: overlay, owns: [groove, low_end, vocal_delivery_verse]}
  fusion_note: "ヴァースはラップで語りの密度を上げ、サビは五音音階のメロディで印象を残す。中国の伝統楽器のサンプルは音色づけに徹し、グルーヴは 808 が担う。両スタイルの担当は重ならない"
  key: "D minor"
  meter: "4/4"
  tempo: 88
  target_duration: "1:33"
  deliverable: [full_mix]
intent:
  one_thing: "愛を誓うしるしだった扇が、証拠品に変わるその瞬間"
  reference_pair:
    - {track: "汪苏泷《桃花扇》", borrow: "「ヴァースでラップし、サビで歌う」というセクションの役割分担だけを取り入れる"}
    - {track: "周杰伦《青花瓷》", borrow: "サビの五音音階のメロディを la で締めくくる手法だけを取り入れる"}
  listener_situation: "スマートフォンの内蔵スピーカーで初めて聴く"
  emotional_arc: [{section: A1, mood: 語り, value: 3}, {section: C1, mood: 哀しみ, value: 7}, {section: A2, mood: 冷ややかさ, value: 4}]
material:
  motif: "ヴァースの最初のフレーズに出る 3 音の下降モチーフ（短3度＋長2度）。弱拍から入り、強拍で終わる 1 拍半のフレーズ"
  character: "感情を押し殺し、顔を上げようとしない"
  stated_in: [A1]

form:
  - {id: A1, name: Verse,  bars: 14, start_bar: 1,  harmony: "|Im |bVII |Im |V7 |", harmony_letters: "|Dm |C |Dm |A7 |", development: new, energy: 3}
  - {id: C1, name: Chorus, bars: 8,  start_bar: 15, harmony: "|Im |bVI |bIII |V7 |", harmony_letters: "|Dm |Bb |F |A7 |", development: extend, energy: 7}
  - {id: A2, name: Verse,  bars: 12, start_bar: 23, harmony: "|Im |bVII |Im |V7 |", harmony_letters: "|Dm |C |Dm |A7 |", development: repeat+vary, energy: 4}
arrangement:
  roster:
    - {id: k808,   midi: {program: 0, bank: 0, channel: 10}, instrument: "808 kick + sub", role: 低频, band: "低频", entry: A1, exit: end}
    - {id: guzheng, midi: {program: 107, bank: 0, channel: 2}, instrument: "古筝のサンプル。フレーズ末尾の装飾にだけ使う", role: 色彩, band: "中高", entry: C1, exit: C1}
    - {id: vox,    midi: {program: 53, bank: 0, channel: 1}, instrument: "男性ボーカル。ヴァースはラップ、サビは歌唱", role: 旋律, band: "中高", entry: A1, exit: end}
  energy_curve: {A1: 3, C1: 7, A2: 4}
  subtraction_events: [{at: {section: A2}, what: "808 を抜き、古筝の倍音とボーカルだけを残す", why: "扇が証拠品になるセクションは冷ややかに響かせたい"}]
  hooks: {arrangement_hook: {what: "古筝の 3 音の下降フレーズ la-sol-mi はサビのフレーズ末尾だけに入れる", first_at: C1, recurs_at: [C1]}}
  groove: {feel: halftime, push_pull: [{part: vox, offset_ms: -15, note: "ラップは拍より前に出す"}], fill_policy: {bars: [14, 21], rationale: "セクションが切り替わる直前"}}
vocal:
  persona: "中低音域の男性ボーカル。ヴァースは語るように、サビは地声で歌う"
  delivery: {A1: "ラップ。子音を強く発音する", C1: "息を多めに混ぜて歌う", A2: "ラップ。マイクにさらに近づき、声を抑える"}
  dynamics_by_section: {A1: 5, C1: 8, A2: 3}
  chorus_variation: "サンプルのため、サビは 1 回のみ"
mix_intent: {mood: "冷たくドライで、扇の骨のように硬い", dynamics: {target_DR_dB: 9}, width_map: {A1: narrow, C1: wide, A2: narrow}, loudness_target: "-10 LUFS"}
render: {suno: {style_prompt: "サンプル"}}
checks: {self_audit: [], exemptions: []}
